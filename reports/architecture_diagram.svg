<svg width="900" height="858" viewBox="0 0 900 858" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Predictive Maintenance Platform — System Architecture</title>
<desc>Data flows from raw sensor readings through a feature pipeline, into classical ML and deep learning models, then through an explainability layer, into a middleware layer, a Streamlit dashboard, a Docker container, and finally a GitHub repository.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="900" height="858" fill="#FFFFFF"/>

<text x="450" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2C2C2A">Predictive Maintenance Platform — System Architecture</text>

<!-- Arrows (drawn first so boxes sit on top) -->
<line x1="450" y1="86" x2="450" y2="136" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="450" y1="192" x2="250" y2="242" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="450" y1="192" x2="650" y2="242" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="250" y1="298" x2="450" y2="348" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="650" y1="298" x2="450" y2="348" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="450" y1="404" x2="450" y2="454" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="450" y1="510" x2="450" y2="560" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="450" y1="616" x2="450" y2="666" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="450" y1="722" x2="450" y2="772" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Row 1: Raw data -->
<rect x="200" y="30" width="500" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="450" y="52" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#173404">Raw sensor data — AI4I 2020 dataset</text>
<text x="450" y="70" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3B6D11">Machine attributes, sensor logs, failure labels</text>

<!-- Row 2: Data pipeline -->
<rect x="200" y="136" width="500" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="450" y="158" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#042C53">Data pipeline &amp; feature engineering</text>
<text x="450" y="176" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Role 1: SQL / ETL — Role 2: EDA &amp; feature engineering</text>

<!-- Row 3: Two models side by side -->
<rect x="60" y="242" width="380" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="250" y="264" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C">Classical ML — Role 3</text>
<text x="250" y="282" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Tuned Random Forest, cost-based threshold</text>

<rect x="460" y="242" width="380" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="650" y="264" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26215C">Deep learning — Role 4</text>
<text x="650" y="282" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">MLP classifier + autoencoder anomaly detector</text>

<!-- Row 4: Explainability -->
<rect x="200" y="348" width="500" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="450" y="370" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#412402">Explainability — Role 5</text>
<text x="450" y="388" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#633806">SHAP feature importance, drift &amp; robustness checks</text>

<!-- Row 5: Middleware -->
<rect x="200" y="454" width="500" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="450" y="476" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Middleware — app/loaders.py (Role 6)</text>
<text x="450" y="494" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#712B13">Loads real model/data artifacts, falls back to mocks if missing</text>

<!-- Row 6: Streamlit app -->
<rect x="200" y="560" width="500" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="450" y="582" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Streamlit dashboard — app/app.py (Role 6)</text>
<text x="450" y="600" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#712B13">Status, batch scoring, DL &amp; anomaly, explainability, about</text>

<!-- Row 7: Docker -->
<rect x="200" y="666" width="500" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="450" y="688" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">Docker container (Role 6)</text>
<text x="450" y="706" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#712B13">Reproducible build &amp; run — Dockerfile, requirements.txt</text>

<!-- Row 8: GitHub -->
<rect x="200" y="772" width="500" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="450" y="794" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">GitHub repository</text>
<text x="450" y="812" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">predictive-maintenance-platform — full team submission</text>

</svg>
